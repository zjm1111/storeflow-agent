[project]
name = "supplymind"
version = "0.1.0"
description = "A traceable supply-chain risk research agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "langgraph>=0.2,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
  "redis>=5,<6",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<6",
  "ortools>=9.10,<10",
  "celery>=5.4,<6",
  "alembic>=1.14,<2",
  "PyJWT>=2.9,<3",
  "prometheus-client>=0.21,<1",
  "langgraph-checkpoint-mysql[pymysql]>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
